# ============================================================
#  STL Digital Voice Agent — CI/CD Pipeline
#  Flow: Security Gate → Tests & Build → Container Scan → Deploy
# ============================================================

name: "CI/CD - Security Scan + GCP Deploy"

on:
  push:
    branches: [ "main", "dev", "brother-international" ]
  pull_request:
    branches: [ "main", "dev", "brother-international" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: "voicebot-support"
  GCP_REGION: "us-central1"
  BACKEND_SERVICE_NAME: "stld-voice-bot"
  FRONTEND_SERVICE_NAME: "stl-voice-frontend"
  ARTIFACT_REGISTRY: "us-central1-docker.pkg.dev"
  BACKEND_IMAGE: "us-central1-docker.pkg.dev/voicebot-support/cloud-run-source-deploy/backend"
  FRONTEND_IMAGE: "us-central1-docker.pkg.dev/voicebot-support/cloud-run-source-deploy/frontend"

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1 ─── DevSecOps & Security Gate
  # ════════════════════════════════════════════════════════════
  security-gate:
    name: "DevSecOps Security Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1. Secrets Leak Detection (Gitleaks) ─────────────
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks Secret Scan
        run: |
          gitleaks detect --source=. --config=.gitleaks.toml --redact -v

      # ── 2. Python SAST & SCA (Bandit & pip-audit) ────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # Reporting only: findings are printed in the log but no longer fail the pipeline.
      # Gitleaks (committed secrets) stays blocking.
      - name: Python SAST Scan (Bandit)
        continue-on-error: true
        run: |
          pip install --upgrade pip bandit
          bandit -r backend/app -ll -ii -s B104 --format custom --msg-template "{abspath}:{line}: {severity} - {test_id} - {msg}"

      - name: Python Dependency Vulnerability Audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip install -r backend/requirements.txt
          pip-audit --desc on 2>&1 | tee /tmp/pip-audit.txt
          # Fail only on HIGH/CRITICAL in our own deps, not upstream tooling CVEs
          if grep -qiE 'httpx|fastapi|pydantic|sqlalchemy|pipecat' /tmp/pip-audit.txt; then
            echo "::error::pip-audit found vulnerability in a direct dependency"
            exit 1
          fi

      # ── 3. Node.js Dependency SCA (npm audit) ───────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependency Audit
        continue-on-error: true
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm audit --audit-level=critical

      # ── 4. Trivy Filesystem & Misconfiguration Scan ─────
      - name: Run Trivy Vulnerability Scanner (Repo & Configs)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  # ════════════════════════════════════════════════════════════
  # JOB 2 ─── Test & Build Gate
  # ════════════════════════════════════════════════════════════
  test-and-build:
    name: "Build & Test Validation"
    runs-on: ubuntu-latest
    needs: security-gate
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Backend Tests ────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Test Environment
        run: |
          cd backend
          cat > .env << 'EOF'
          HOST=0.0.0.0
          PORT=8055
          DATABASE_URL=sqlite+aiosqlite:///./test.db
          LOG_LEVEL=INFO
          DEBUG=False
          EOF

      - name: Run Smoke Tests
        run: |
          cd backend
          python -m pytest tests/test_smoke.py -v

      - name: Run Full Test Suite
        run: |
          cd backend
          python -m pytest tests -q

      # ── Frontend Build ───────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm ci
          cat > .env.production << 'EOF'
          NEXT_PUBLIC_API_URL=https://voicebot-agent.stldigitaltech.com
          EOF
          npm run build

  # ════════════════════════════════════════════════════════════
  # JOB 3 ─── Hardened Docker Build & Trivy Scan
  # ════════════════════════════════════════════════════════════
  docker-build-scan:
    name: "Container Build & Hardening"
    runs-on: ubuntu-latest
    needs: [ security-gate, test-and-build ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      has_creds: ${{ steps.check-gcp.outputs.enabled }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "version=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      # ── Build Backend Image Locally for Security Scan ────
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: backend-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Container (Trivy)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-scan:latest
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true

      # ── Build Frontend Image Locally for Security Scan ───
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: frontend-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Frontend Container (Trivy)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-scan:latest
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true

      # ── Check for GCP Credentials ─────────────────────────
      - name: Check GCP Credentials
        id: check-gcp
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "Notice: GCP_SA_KEY secret not found; skipping image push to Artifact Registry."
          fi

      # ── Authenticate to GCP & Push to Artifact Registry ─
      - name: Authenticate to Google Cloud
        if: steps.check-gcp.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP Artifact Registry
        if: steps.check-gcp.outputs.enabled == 'true'
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Push Backend Image to Artifact Registry
        if: steps.check-gcp.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Push Frontend Image to Artifact Registry
        if: steps.check-gcp.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ════════════════════════════════════════════════════════════
  # JOB 4 ─── Deploy to Google Cloud Run
  # ════════════════════════════════════════════════════════════
  deploy-cloudrun:
    name: "Deploy to GCP Cloud Run"
    runs-on: ubuntu-latest
    needs: [ docker-build-scan ]
    # Manual only (Actions > Run workflow). A green push no longer deploys anything automatically.
    if: github.event_name == 'workflow_dispatch' && needs.docker-build-scan.outputs.has_creds == 'true'
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ── Deploy Backend to Cloud Run ───────────────────────
      - name: Deploy Backend Service to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.BACKEND_IMAGE }}:latest
          flags: |
            --allow-unauthenticated
            --port=8055
            --memory=1Gi
            --cpu=1
            --min-instances=1
            --max-instances=10

      # ── Deploy Frontend to Cloud Run ──────────────────────
      - name: Deploy Frontend Service to Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.FRONTEND_IMAGE }}:latest
          env_vars: |
            NEXT_PUBLIC_API_URL=${{ steps.deploy-backend.outputs.url }}
          flags: |
            --allow-unauthenticated
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=1
            --max-instances=5

      # ── Verify Service Health ─────────────────────────────
      - name: Post-Deployment Health Probe
        run: |
          echo "Backend Cloud Run URL: ${{ steps.deploy-backend.outputs.url }}"
          echo "Frontend Cloud Run URL: ${{ steps.deploy-frontend.outputs.url }}"
          curl -sf "${{ steps.deploy-backend.outputs.url }}/health"

  # ════════════════════════════════════════════════════════════
  # JOB 5 ─── Deploy to the production GCP VM (Docker Compose)
  # This is the environment that serves the live Smartflo voice calls.
  # Requires repo secrets: VM_SSH_HOST, VM_SSH_USER, VM_SSH_KEY.
  # ════════════════════════════════════════════════════════════
  deploy-vm:
    name: "Deploy to GCP VM (voice backend)"
    runs-on: ubuntu-latest
    needs: [ test-and-build ]
    # Manual only. The VM is hand-managed (bind-mounted code, VM-specific compose), so a push must never redeploy it.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/brother-international'
    timeout-minutes: 20
    steps:
      - name: Deploy code to VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 18m
          envs: GH_TOKEN
          script: |
            set -e
            cd /opt/stl-voicebot

            # ── Snapshot current state for rollback ──
            PREV_COMMIT=$(sudo git rev-parse HEAD)
            echo "Pre-deploy commit: $PREV_COMMIT"

            # ── Pull latest code (skip .env and DB) ──
            sudo git fetch "https://x-access-token:${GH_TOKEN}@github.com/STL-Digital-01/STL-ASR-TTS-Voiceagent-advance-v01.git" brother-international
            sudo git checkout FETCH_HEAD -- \
              backend/app \
              backend/knowledge_base \
              backend/tests \
              frontend/app \
              frontend/components \
              frontend/lib \
              kpi_dashboard \
              scripts \
              CLAUDE.md

            # ── Rebuild app containers (leave infra alone) ──
            sudo docker compose up -d --build --no-deps backend frontend
            sleep 10

            # ── Post-deploy health check ──
            HEALTH=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8055/health || echo "000")
            if [ "$HEALTH" != "200" ]; then
              echo "Health check FAILED (HTTP $HEALTH) — rolling back to $PREV_COMMIT"
              sudo git checkout "$PREV_COMMIT" -- \
                backend/app \
                backend/knowledge_base \
                backend/tests
              sudo docker compose up -d --build --no-deps backend frontend
              sleep 10
              echo "Rollback complete. Verifying..."
              curl -sf http://localhost:8055/health && echo "Rollback healthy" || echo "ROLLBACK ALSO FAILED — manual intervention needed"
              exit 1
            fi

            echo "Deploy successful — health check passed"
            sudo docker compose ps
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
