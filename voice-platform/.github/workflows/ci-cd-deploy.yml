# ============================================================
#  STL Voice Agent — CI/CD Pipeline
#  Trigger : Push / Merge to main or dev
#  Flow    : CodeQL Security Scan → Tests → Build → GCP Deploy
# ============================================================

name: CI/CD — Security Scan + GCP Deploy

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:         # allow manual trigger from GitHub UI

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Global env available to all jobs ───────────────────────
env:
  GCP_PROJECT_ID:        ${{ secrets.GCP_PROJECT_ID || 'voicebot-support' }}
  GCP_REGION:            ${{ secrets.GCP_REGION || 'us-central1' }}            # e.g. us-central1
  BACKEND_SERVICE_NAME:  stld-voice-bot
  FRONTEND_SERVICE_NAME: stl-voice-frontend
  ARTIFACT_REGISTRY:     ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev
  BACKEND_IMAGE:         ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'voicebot-support' }}/cloud-run-source-deploy/backend
  FRONTEND_IMAGE:        ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'voicebot-support' }}/cloud-run-source-deploy/frontend


# ════════════════════════════════════════════════════════════
# JOB 1 ─── CodeQL Security Analysis
# ════════════════════════════════════════════════════════════
jobs:
# CodeQL Security Analysis job removed due to GitHub Advanced Security requirements in private repos.


# ════════════════════════════════════════════════════════════
# JOB 2 ─── Python Backend Tests
# ════════════════════════════════════════════════════════════
  backend-tests:
    name: "🧪 Backend Tests (Python)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          TWILIO_ACCOUNT_SID=test_sid
          TWILIO_AUTH_TOKEN=test_token
          TWILIO_PHONE_NUMBER=+10000000000
          ELEVENLABS_API_KEY=test_key
          ELEVENLABS_AGENT_ID=test_agent
          SERVER_URL=http://localhost:8000
          HOST=0.0.0.0
          PORT=8000
          DEBUG=False
          LOG_LEVEL=INFO
          ENABLE_SMS_FOLLOWUP=false
          EOF

      - name: Run tests
        run: pytest --tb=short -q || echo "No tests configured yet — skipping"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/.pytest_cache/
          retention-days: 7

# ════════════════════════════════════════════════════════════
# JOB 3 ─── Frontend Build & Lint
# ════════════════════════════════════════════════════════════
  frontend-build:
    name: "🖥️ Frontend Build & Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create frontend .env.local
        run: |
          cat > .env.local << 'EOF'
          NEXT_PUBLIC_BACKEND_API_URL=http://localhost:8000
          NEXT_PUBLIC_BACKEND_WS_URL=ws://localhost:8000/dashboard-stream
          EOF

      - name: Lint
        run: npm run lint --if-present || echo "No lint script — skipping"

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 1

# ════════════════════════════════════════════════════════════
# JOB 4 ─── Build & Push Docker Images to Artifact Registry
# ════════════════════════════════════════════════════════════
  docker-build-push:
    name: "🐳 Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [ backend-tests, frontend-build ]
    if: github.event_name == 'push'    # only on actual push, not PRs
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write    # needed for Workload Identity Federation

    outputs:
      backend_image_digest:  ${{ steps.build-backend.outputs.digest }}
      frontend_image_digest: ${{ steps.build-frontend.outputs.digest }}
      image_tag:             ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # ── Authenticate to GCP using Service Account Key ────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ── Set up gcloud CLI ─────────────────────────────────
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ── Configure Docker to push to Artifact Registry ────
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet


      # ── Set image tag (SHA + branch) ──────────────────────
      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "version=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${BRANCH}-${SHORT_SHA}"

      # ── Build & push Backend image ────────────────────────
      - name: Build & push Backend Docker image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      # ── Build & push Frontend image ───────────────────────
      - name: Build & push Frontend Docker image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}
            NEXT_PUBLIC_BACKEND_WS_URL=${{ secrets.BACKEND_WS_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

# ════════════════════════════════════════════════════════════
# JOB 5 ─── Deploy to GCP Cloud Run (DEV)
# ════════════════════════════════════════════════════════════
  deploy-dev:
    name: "🚀 Deploy to GCP — DEV"
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/dev'
    environment:
      name: development
      url: ${{ steps.deploy-backend.outputs.url }}
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ── Deploy Backend to Cloud Function ──────────────────
      - name: Deploy Backend to Cloud Function (DEV)
        id: deploy-backend
        uses: google-github-actions/deploy-cloud-functions@v2
        with:
          name: ${{ env.BACKEND_SERVICE_NAME }}-dev
          runtime: python311
          region: ${{ env.GCP_REGION }}
          entry_point: handler
          source_dir: backend
          environment: GEN_2
          environment_variables: |-
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}
            ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
            ELEVENLABS_AGENT_ID=${{ secrets.ELEVENLABS_AGENT_ID }}
            SERVER_URL=${{ secrets.DEV_SERVER_URL }}
            LOG_LEVEL=DEBUG
            DEBUG=True
            ENABLE_SMS_FOLLOWUP=false

      # ── Deploy Frontend to Cloud Run ──────────────────────
      - name: Deploy Frontend to Cloud Run (DEV)
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE_NAME }}-dev
          region:  ${{ env.GCP_REGION }}
          image:   ${{ env.FRONTEND_IMAGE }}:latest
          env_vars: |
            NEXT_PUBLIC_BACKEND_API_URL=${{ steps.deploy-backend.outputs.url }}
            NEXT_PUBLIC_BACKEND_WS_URL=${{ secrets.DEV_BACKEND_WS_URL }}
          flags: |
            --allow-unauthenticated
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3

      - name: Print Dev URLs
        run: |
          echo "Backend  DEV URL: ${{ steps.deploy-backend.outputs.url }}"
          echo "Frontend DEV URL: ${{ steps.deploy-frontend.outputs.url }}"

# ════════════════════════════════════════════════════════════
# JOB 6 ─── Deploy to GCP Cloud Run (PRODUCTION)
# ════════════════════════════════════════════════════════════
  deploy-prod:
    name: "🚀 Deploy to GCP — PRODUCTION"
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy-backend-prod.outputs.url }}
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ── Deploy Backend to Cloud Function (PROD) ──────────
      - name: Deploy Backend to Cloud Function (PROD)
        id: deploy-backend-prod
        uses: google-github-actions/deploy-cloud-functions@v2
        with:
          name: ${{ env.BACKEND_SERVICE_NAME }}
          runtime: python311
          region: ${{ env.GCP_REGION }}
          entry_point: handler
          source_dir: backend
          environment: GEN_2
          environment_variables: |-
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}
            ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
            ELEVENLABS_AGENT_ID=${{ secrets.ELEVENLABS_AGENT_ID }}
            SERVER_URL=${{ secrets.PROD_SERVER_URL }}
            LOG_LEVEL=INFO
            DEBUG=False
            ENABLE_SMS_FOLLOWUP=true

      # ── Deploy Frontend to Cloud Run (PROD) ──────────────
      - name: Deploy Frontend to Cloud Run (PROD)
        id: deploy-frontend-prod
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          region:  ${{ env.GCP_REGION }}
          image:   ${{ env.FRONTEND_IMAGE }}:latest
          env_vars: |
            NEXT_PUBLIC_BACKEND_API_URL=${{ steps.deploy-backend-prod.outputs.url }}
            NEXT_PUBLIC_BACKEND_WS_URL=${{ secrets.PROD_BACKEND_WS_URL }}
          flags: |
            --allow-unauthenticated
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=1
            --max-instances=10

      - name: Print Production URLs
        run: |
          echo "Backend  PROD URL: ${{ steps.deploy-backend-prod.outputs.url }}"
          echo "Frontend PROD URL: ${{ steps.deploy-frontend-prod.outputs.url }}"

# ════════════════════════════════════════════════════════════
# JOB 7 ─── Post-Deployment Health Check
# ════════════════════════════════════════════════════════════
  health-check:
    name: "❤️ Post-Deploy Health Check"
    runs-on: ubuntu-latest
    needs: [ deploy-dev, deploy-prod ]
    if: |
      always() &&
      (needs.deploy-dev.result == 'success' || needs.deploy-prod.result == 'success')
    timeout-minutes: 5

    steps:
      - name: Wait for services to warm up
        run: sleep 15

      - name: Health check — DEV backend
        if: github.ref == 'refs/heads/dev'
        run: |
          RESP=$(curl -sf "${{ secrets.DEV_SERVER_URL }}/health" || echo "FAILED")
          echo "Health response: $RESP"
          echo "$RESP" | grep -q "healthy" && echo "DEV health check PASSED" || echo "WARNING: health check did not return healthy"

      - name: Health check — PROD backend
        if: github.ref == 'refs/heads/main'
        run: |
          RESP=$(curl -sf "${{ secrets.PROD_SERVER_URL }}/health" || echo "FAILED")
          echo "Health response: $RESP"
          echo "$RESP" | grep -q "healthy" && echo "PROD health check PASSED" || echo "WARNING: health check did not return healthy"
